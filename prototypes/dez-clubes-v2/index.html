</style></head><body><div id="app"></div><script type="module">// Separate fictional football simulation. No storage, browser APIs or dependencies.
const CLUBS=[
 ['sao-luiz','São Luiz',43,20,'#b12c35'],['brasil-pelotas','Brasil de Pelotas',47,28,'#9f2630'],['caxias','Caxias',51,34,'#742d49'],['ypiranga','Ypiranga',54,38,'#467741'],['juventude','Juventude',59,47,'#418652'],['ponte-preta','Ponte Preta',61,49,'#353b45'],['vitoria','Vitória',66,59,'#aa3036'],['vasco','Vasco',71,69,'#343944'],['gremio','Grêmio',75,77,'#3983b3'],['flamengo','Flamengo',79,85,'#b6383c']

const KEYS=['finishing','passing','reading','pace','defending','goalkeeping'];
const WEIGHTS={GK:[0,.1,.25,.05,.1,.5],CB:[.05,.15,.3,.1,.4,0],FB:[.1,.25,.2,.25,.2,0],DM:[.05,.25,.3,.1,.3,0],CM:[.1,.35,.3,.15,.1,0],AM:[.2,.35,.3,.15,0,0],WG:[.3,.2,.2,.3,0,0],ST:[.5,.1,.2,.2,0,0]};
const clamp=(v,min=0,max=100)=>Math.max(min,Math.min(max,v));
const random=g=>{g.rng=(Math.imul(g.rng,1664525)+1013904223)>>>0;return g.rng/4294967296;};
const roll=(g,p)=>random(g)<clamp(p,0,1);
const integer=(g,min,max)=>min+Math.floor(random(g)*(max-min+1));
const stat=()=>({apps:0,starts:0,minutes:0,goals:0,assists:0,ratingSum:0});
const club=g=>CLUBS.find(c=>c.id===g.clubId)??null;
function overall(g){return Math.round(KEYS.reduce((s,k,i)=>s+g.skills[k]*WEIGHTS[g.position][i],0)*(.9+g.proficiency*.001));}
const option=(id,label,hint)=>({id,label,hint});
const num=v=>v.toFixed(1).replace('.',',');
const primary=g=>KEYS[WEIGHTS[g.position].indexOf(Math.max(...WEIGHTS[g.position]))];
function event(g,kind,title,body,choices=[]){g.serial++;g.event={id:`p10v2-${g.serial}`,kind,title,body,choices:choices.map(c=>({...c,id:`${c.id}@${g.serial}`}))};}
function log(g,text){g.log.unshift(text);g.log=g.log.slice(0,100);}
function memory(g,text,change=0,critical=false){const c=club(g);if(!c)return;const m=g.fanMemory[c.id]??={respect:50,entries:[],criticalEntries:[]};m.respect=clamp(m.respect+change);if(critical){m.criticalEntries.unshift(text);m.criticalEntries=m.criticalEntries.slice(0,10);}else{m.entries.unshift(text);m.entries=m.entries.slice(0,4);}}
const labelSkill={finishing:'finalização',passing:'passe',reading:'leitura',pace:'velocidade',defending:'defesa',goalkeeping:'segurança no gol'};
function growth(g,focus,extra=false){
 for(const [i,k]of KEYS.entries()){const role=.55+WEIGHTS[g.position][i]*2;const gain=.34*g.dna.learning*g.dna.aptitudes[k]*role*(focus===k?1.65:1)*(extra?1.7:1)*(.72+g.condition/350)*Math.max(.7,1-g.fatigue/250)*(1-g.skills[k]/120);g.skills[k]=clamp(g.skills[k]+gain,0,99);}
}
const intents=g=>g.position==='GK'?['SAFE','BUILD','SWEEP']:['CB','FB','DM'].includes(g.position)?['HOLD','BUILD','ADVANCE']:g.position==='ST'?['ATTACK','LINK','PRESS']:['CREATE','ATTACK','CONTROL'];
const focusFor=(g,intent)=>({SAFE:'goalkeeping',BUILD:'passing',SWEEP:'reading',HOLD:'defending',ADVANCE:g.position==='FB'?'pace':'defending',ATTACK:'finishing',LINK:'passing',PRESS:'pace',CREATE:'passing',CONTROL:'reading'})[intent]??primary(g);
function formationEvent(g){g.age=[12,14,16][g.formation];g.objective={title:'Aprender sua posição',body:'Três etapas de formação antes do primeiro projeto adulto.',progress:{stages:g.formation},target:{stages:3},progressText:`${g.formation}/3 etapas`,targetText:'3 etapas; escolha onde acumular experiência',status:'ACTIVE'};event(g,'FORMATION',`Seu jogo aos ${g.age}`,`Como ${POSITIONS.find(p=>p.id===g.position).label.toLowerCase()}, você ainda constrói habilidade e experiência. Esta etapa registra aprendizado; o adulto não começa pronto.`,[option('formation:technique','Lapidar a técnica da posição','Melhora as habilidades relevantes para sua função.'),option('formation:reading','Especializar a leitura de jogo','Trabalha leitura/passe e mais experiência na posição.'),option('formation:athletic','Ganhar ritmo e solidez','Trabalha velocidade/defesa e experiência.')]);}
function createGame(name,position,seed=Date.now()>>>0){
 if(!POSITIONS.some(p=>p.id===position))throw new Error('Posição inválida');
 const g={schema:2,name:String(name||'Jogador').slice(0,60),age:12,position,clubId:null,condition:85,fatigue:10,pressure:15,confidence:60,trust:48,skills:{},proficiency:28,dna:{learning:0,aptitudes:{}},rng:Number(seed)>>>0,seed:Number(seed)>>>0,round:0,season:18,period:0,formation:0,phase:'FORMATION',serial:0,decisions:0,totalstats:stat(),seasonStats:stat(),yearStats:[],playedMatches:[],lastMatches:[],history:[],log:[],fanMemory:{},reputation:0,rival:null,market:[],resolved:[],choicesLog:[],progression:[],objective:null,objectiveHistory:[],lastOutcome:null,roleEvidence:null,recoveryUsed:false,recoveryWork:null,recoveryArc:null,decisiveUsed:false,decisive:null,schedule:[],event:null};
 g.dna.learning=.85+random(g)*.55;for(const k of KEYS){g.dna.aptitudes[k]=.8+random(g)*.55;g.skills[k]=14+random(g)*9;}formationEvent(g);return g;
}
function schedule(g){const rivals=CLUBS.filter(c=>c.id!==g.clubId);let offset=(g.seed+g.season)%9;const last=g.playedMatches.at(-1)?.opponentId;if(rivals[offset].id===last)offset=(offset+1)%9;const first=[...rivals.slice(offset),...rivals.slice(0,offset)].map(c=>c.id);g.schedule=[...first,...first];}

function rivalEvent(g){const c=club(g);g.rival={name:['Rafael Nunes','Bruno Medeiros','Caio Fontes'][g.history.length%3],quality:c.level-1};event(g,'RIVALRY','Um projeto, uma disputa por espaço',`${g.rival.name} é um concorrente fictício de nível ${g.rival.quality}. Seu nível é ${overall(g)}. No ${c.name}, a entrada em campo será observada: escolher uma postura não compra a vaga.`,[option('rival:earn','Mostrar meu jogo na função','A próxima meta avaliará sua produção e seus minutos.'),option('rival:team','Construir parceria com o elenco','Estabelece a intenção de cooperar; a contribuição nas partidas decide o efeito.'),option('rival:challenge','Disputar um papel mais ofensivo','Eleva a exigência da próxima meta, sem ganhar titularidade no clique.')]);}
function outputLabel(g){if(g.recoveryWork==='COOPERATE')return 'ações de cooperação';return g.position==='GK'?'defesas':g.position==='ST'?'gols':g.position==='CB'||g.position==='DM'?'intervenções':g.position==='FB'?'ações de criação e intervenção':'chances criadas';}
function objective(g){const strong=overall(g)>=club(g).level+6;const target={apps:strong?4:3,minutes:strong?220:150,good:strong?3:2,output:g.position==='ST'?1:g.position==='GK'?6:['CB','DM'].includes(g.position)?8:g.position==='FB'?10:6};if(g.intentChallenge)target.good++;g.intentChallenge=false;
 if(g.recoveryWork==='COOPERATE')target.output=3;
 return {season:g.season,period:g.period+1,clubId:g.clubId,metric:g.recoveryWork==='COOPERATE'?'cooperation':'role',title:g.recoveryWork?'Provar a mudança de trabalho':'Conquistar confiança pela atuação',body:`O treinador avaliará ${outputLabel(g)} e boas atuações com tempo suficiente, em seis partidas. A ausência de minutos limita a amostra; não vira uma atuação ruim.`,progress:{apps:0,minutes:0,good:0,output:0},target,progressText:`0/${target.apps} participações · 0/${target.minutes} min · 0/${target.good} boas atuações · 0/${target.output} ${outputLabel(g)}`,targetText:`${target.apps} participações, ${target.minutes} min, ${target.good} boas atuações (≥35 min/nota≥7) e ${target.output} ${outputLabel(g)}`,status:'ACTIVE'};}
function planEvent(g){g.objective=objective(g);const opponent=CLUBS.find(c=>c.id===g.schedule[g.round]);const harder=opponent.level>club(g).level+8;const window=g.period+1;const labels={SAFE:['Proteger o gol nas finalizações','Prioriza defesas e leitura; saída curta reduz exposição.'],BUILD:['Iniciar as jogadas com passe','Prioriza passes e criação na saída; erro de construção pode expor o time.'],SWEEP:['Antecipar bolas nas costas','Mais intervenções fora do gol, com risco de exposição.'],HOLD:[harder?'Fechar o setor contra um rival forte':'Ganhar a disputa no meu setor','Prioriza leitura e intervenções; reduz a exposição defensiva.'],ADVANCE:[`Apoiar a construção pela ${g.position==='FB'?'faixa':'recuperação'}`,'Mais chance de criar, com espaço deixado para o rival.'],ATTACK:[g.position==='ST'?`Atacar o espaço contra ${opponent.shortName}`:`Chegar para finalizar neste período`,'Prioriza finalizações e movimentos ofensivos; cobra contribuição no ataque.'],LINK:[`Conectar o ataque para ${window===1?'ganhar':'sustentar'} espaço`,'Prioriza passes e criação; não exige marcar em toda partida.'],PRESS:['Pressionar a saída do adversário','Prioriza intervenções adiantadas e leitura; pede mais energia.'],CREATE:[`Criar oportunidades ${window===2?'entre as linhas':window===3?'no último terço':'para o ataque'}`,'Prioriza passes-chave e chances criadas; gols são uma parte da contribuição.'],CONTROL:[harder?'Controlar o jogo sem se expor':'Dar ritmo ao meio-campo','Prioriza passes e leitura; avalia qualidade das ações, não só gols.']};
 event(g,'PLAN',`${g.season} anos · ${window}º período: ${g.objective.title}`,`Próximo rival: ${opponent.name}, nível ${opponent.level}; ${club(g).name}, nível ${club(g).level}. ${g.objective.targetText}. Recuperação entre jogos é automática; você escolhe uma intenção esportiva para os próximos seis jogos.`,intents(g).map(id=>option(`intent:${id}`,labels[id][0],labels[id][1])));
}
function recoveryEvent(g){g.recoveryUsed=true;g.recoveryArc={clubId:g.clubId,season:g.season,status:'CHOOSING',beforeStarts:(g.lastMatches.length?g.lastMatches:g.playedMatches.filter(m=>m.season===g.season-1).slice(-6)).filter(m=>m.started).length,beforeLevel:overall(g),work:null};event(g,'RECOVERY','Uma resposta para recuperar espaço',`No último período registrado: ${(g.lastMatches.length?g.lastMatches:g.playedMatches.filter(m=>m.season===g.season-1).slice(-6)).filter(m=>m.minutes).length} participações, ${(g.lastMatches.length?g.lastMatches:g.playedMatches.filter(m=>m.season===g.season-1).slice(-6)).filter(m=>m.started).length} titularidades. A meta não foi cumprida ou a oportunidade foi limitada. Escolha uma mudança concreta para ser avaliada no próximo período, sem um bônus automático de vaga.`,[option('recovery:EXTRA',`Trabalhar mais ${labelSkill[primary(g)]}`,'Mais aprendizado da habilidade por seis jogos; esforço cobra condição e fadiga. O retorno depende da atuação.'),option('recovery:READ','Rever as ações e mudar a leitura','Mais aprendizado de leitura por seis jogos; a nova meta precisa de evidência em campo.'),option('recovery:COOPERATE','Apoiar uma função mais simples','Mais aprendizado de passe e exigência orientada à cooperação; não concede minutos imediatamente.')]);}
function decisiveEvent(g){g.decisiveUsed=true;event(g,'DECISIVE','Um teste real para sua nova resposta',`Na próxima participação de ao menos 45 minutos, o treinador observará sua postura. Uma entrada curta não será tratada como prova decisiva. A janela dura até seis jogos.`,[option('decisive:risk','Assumir uma intervenção mais ambiciosa','Aumenta ações e criação, mas expõe o time; reconhecimento depende da atuação suficiente.'),option('decisive:safe','Provar consistência na função','Reduz exposição, priorizando ações corretas; ainda exige desempenho observado.')]);}

function updateObjective(g,m){const o=g.objective;if(m.minutes){o.progress.apps++;o.progress.minutes+=m.minutes;o.progress.good+=m.minutes>=35&&m.rating>=7?1:0;o.progress.output+=roleOutput(g,m);}o.progressText=`${o.progress.apps}/${o.target.apps} participações · ${o.progress.minutes}/${o.target.minutes} min · ${o.progress.good}/${o.target.good} boas atuações · ${o.progress.output}/${o.target.output} ${outputLabel(g)}`;}

 g.lastOutcome.season=g.season;g.lastOutcome.clubId=g.clubId;g.lastOutcome.status=o.status;g.lastOutcome.target={...o.target};g.lastOutcome.achieved={...o.progress};
 if(g.recoveryWork){const met=o.status==='MET';g.recoveryArc.status=met?'PROVED':'UNPROVED';g.recoveryArc.afterStarts=g.lastMatches.filter(m=>m.started).length;g.recoveryArc.afterLevel=overall(g);memory(g,`Resposta ${g.recoveryWork}: ${met?'mudança comprovada pela meta':'mudança ainda sem comprovação'}; ${o.progressText}.`,met?2:0,true);g.recoveryWork=null;}

function simulate(g,intent){

function protoMemories(){const g=protoGame,m=g.fanMemory??{};const array=Object.entries(m).flatMap(([clubId,x])=>[...(x.criticalEntries??[]),...(x.entries??[])].map(text=>`${CLUBS.find(c=>c.id===clubId)?.shortName??clubId} · ${text}`));return array.length?`<details><summary>O futebol lembra · ${array.length} registros</summary><div class="memory-list">${array.slice(-12).map(x=>`<p>${protoEsc(typeof x==='string'?x:x.text??x.description??x.label??'Marco registrado')}</p>`).join('')}</div></details>`:'';}
function protoFooter(){return `<nav class="nav-actions" aria-label="Carreira do protótipo"><button class="quiet" id="proto-history">${protoPage==='history'?'Voltar ao jogo':'Minha história'}</button><button class="quiet" id="proto-export">Exportar carreira</button><button class="quiet" id="proto-reset">Recomeçar</button></nav>`;}
function protoPlay(){const g=protoGame,e=g.event;let decisionText=e.body,decisionTitle=e.title;if(e.kind==='PLAN'&&g.objective?.targetText)decisionText=decisionText.replace(g.objective.targetText+'. ','').trim();if(e.kind==='PLAN'&&g.objective?.title)decisionTitle=decisionTitle.replace(': '+g.objective.title,'');const done=e.kind==='DONE'||g.phase==='DONE';const body=done?`<section class="panel end-card"><span class="eyebrow">O recorte terminou. A carreira ainda pode ir além.</span><h1>${protoEsc(e.title)}</h1><p>${protoEsc(e.body)}</p>${protoStats(g.totalstats)}</section>`:`<section class="decision" aria-label="Decisão atual"><span class="eyebrow">${g.age<18?'Formação':`Ano ${g.season-17} de 3`} · ${protoEsc(({FORMATION:'Sua formação',RIVALRY:'Disputa por vaga',PLAN:'Projeto esportivo',DECISIVE:'Jogo importante',INTEREST:'Interesse do mercado',CONTACT:'Negociação',OFFER:'Proposta concreta',DONE:'Sua história',RECOVERY:'Retomar espaço',ASSESSMENT:'Avaliação',ASSESSMENT_RESULT:'Resposta da avaliação',RESPONSE:'Resposta ao treinador'})[e.kind]??'Sua carreira')}</span><h2>${protoEsc(decisionTitle)}</h2><p class="decision-body">${protoEsc(decisionText)}</p>${e.choices.map((c,i)=>`<button class="choice" data-proto-choice="${protoEsc(c.id)}" data-proto-event="${protoEsc(e.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${protoEsc(c.label)}</strong>${c.hint?`<small>${protoEsc(c.hint)}</small>`:''}</span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</section>`;protoRoot.innerHTML=protoShell(`${protoHeader()}${protoStates()}${protoStats(g.seasonStats)}${protoEvidence()}${protoOutcome()}${protoObjective()}${protoSkillRows()}${body}${protoGoal()}${protoLastMatches()}${protoMemories()}${protoFooter()}`);protoBind();}
function protoHistory(){const g=protoGame;const records=g.history??[];const years=g.yearStats??[];protoRoot.innerHTML=protoShell(`${protoHeader()}<section class="panel"><span class="eyebrow">Seu futebol, até aqui</span>${protoStats(g.totalstats)}${years.map(y=>`<article class="timeline"><h3>${y.age} anos · ${protoEsc(CLUBS.find(c=>c.id===y.clubId)?.shortName??'Clube')}</h3>${protoStats(y)}</article>`).join('')}${(g.progression??[]).map(x=>`<article class="timeline"><h3>${x.season} anos · ${x.period?'período '+x.period:'formação'}</h3><p>Overall ${protoN(x.beforeOverall)} → ${protoN(x.afterOverall)} · experiência ${x.experienceGain>0?'+':''}${protoN(x.experienceGain,1)}</p></article>`).join('')}${(g.objectiveHistory??[]).map(o=>`<article class="timeline"><h3>${o.season} anos · período ${o.period} · ${protoEsc(CLUBS.find(c=>c.id===o.clubId)?.shortName??'Formação')}</h3><p>${protoEsc(o.title)} · ${o.status==='MET'?'cumprida':'não cumprida'}</p><p>${protoEsc(o.targetText)}</p><p>${protoEsc(o.progressText)}</p></article>`).join('')}${records.map(h=>`<article class="timeline"><h3>${protoEsc(h.title??h.club??h.headline??`${h.age??h.season??''} anos · ${CLUBS.find(c=>c.id===h.clubId)?.shortName??'Clube'}`)}</h3><p>${protoEsc(h.body??h.detail??h.text??h.reason??'')}</p>${h.stats?protoStats(h.stats):''}</article>`).join('')}${(g.log??[]).slice(0,20).map(x=>`<p>${protoEsc(protoHumanText(typeof x==='string'?x:x.text??x.detail??x.title??'Marco registrado'))}</p>`).join('')}</section>${(g.choicesLog??[]).map(x=>`<p class="choice-history">${x.age} anos · ${protoEsc(x.label)}</p>`).join('')}${protoMemories()}<details><summary>Os dez clubes deste cenário</summary><div class="league">${CLUBS.map(c=>`<div><span>${protoEsc(c.name)}</span><span>${c.level>=75?'Grande projeto':c.level>=60?'Projeto em crescimento':'Clube de entrada'}</span></div>`).join('')}</div></details>${protoFooter()}`);protoBind();}
function protoBind(){document.querySelectorAll('[data-proto-choice]').forEach(b=>b.addEventListener('click',()=>{if(!protoGame||b.dataset.protoEvent!==protoGame.event.id)return;const before=Object.fromEntries(['condition','fatigue','pressure','confidence','trust'].map(k=>[k,protoGame[k]]));if(!choose(protoGame,b.dataset.protoChoice))return;protoDelta=Object.fromEntries(Object.keys(before).map(k=>[k,protoGame[k]-before[k]]));protoStore();protoRender();document.querySelector('.decision')?.scrollIntoView({block:'nearest',behavior:'instant'});}));document.querySelector('#proto-history')?.addEventListener('click',()=>{protoPage=protoPage==='history'?'play':'history';protoRender();});document.querySelector('#proto-export')?.addEventListener('click',()=>protoDownload(JSON.stringify(protoGame,null,2),'1903-dez-clubes02-carreira.json'));document.querySelector('#proto-reset')?.addEventListener('click',()=>{if(!confirm('Recomeçar apenas a carreira deste protótipo? Você pode exportá-la antes.'))return;try{localStorage.removeItem(protoKey);protoGame=null;protoRaw=null;protoDelta={};protoError='';protoPage='play';protoRender();}catch{protoError='Não foi possível apagar a carreira. Ela foi preservada.';protoRender();}});}
function protoRender(){if(!protoGame)protoStart();else if(protoPage==='history')protoHistory();else protoPlay();}
protoLoad();protoRender();
</script></body></html>
