function renderWorld() { const p = save.player; const rel = Object.values(p.fanRelations).filter(x => Math.max(x.passion, x.hate, x.fear, x.respect) > 1).sort((a, b) => Math.max(b.passion, b.hate, b.fear, b.respect) - Math.max(a.passion, a.hate, a.fear, a.respect)).slice(0, 8); root.innerHTML = appShell(`<section class="world-head"><span class="eyebrow">MUNDO</span><h2>Brasil · 156 clubes</h2><p>Seu nome começa a significar coisas diferentes em cada estádio.</p></section>${currentCoachCard()}${save.player.currentClubId && p.coaching ? `<h3 class="section-title">Campanha do clube</h3><div class="league-table">${standings(p, p.currentClubId).map((c, i) => `<div class="league-row ${c.clubId === p.currentClubId ? 'current' : ''}"><span>${i + 1}</span><b>${esc(getClub(c.clubId).shortName)}</b><span>${c.games}J</span><strong>${c.points} pts</strong></div>`).join('')}</div>` : ''}<h3 class="section-title">Minha posição no mercado</h3>${intentButtons()}<h3 class="section-title">Torcidas</h3><div class="relation-list">${rel.length ? rel.map(r => { const [label, v] = relationLabel(r); return `<div class="relation"><div><b>${getClub(r.clubId)?.name ?? r.clubId}</b><span>${label}</span></div><strong>${Math.round(v)}</strong></div>`; }).join('') : '<div class="empty">Ainda é cedo para o futebol ter uma opinião forte sobre você.</div>'}</div><h3 class="section-title">Transferências</h3>${p.transferHistory.length ? p.transferHistory.map(t => `<div class="transfer"><span>${t.season}</span><b>${getClub(t.fromClubId)?.shortName ?? 'Formação'} → ${getClub(t.toClubId)?.shortName}</b><strong>${money(t.fee)}</strong></div>`).join('') : '<div class="empty small">Nenhuma transferência profissional.</div>'}${coachDatabase()}<details class="settings"><summary>Configurações e dados</summary><button class="action" id="export">Exportar diagnóstico completo</button><button class="action danger" id="reset">Apagar carreira</button></details>`); bind(); }
function render() { if (getPersistenceStatus().kind === 'corrupt' && !save)
    return renderRecovery(); if (!save)
    return renderCreate(); if (tab === 'player')
    return renderPlayer(); if (tab === 'stats')
    return renderStats(); if (tab === 'world')
    return renderWorld(); renderCareer(); }
function bind() {
    document.querySelector('#recover-raw')?.addEventListener('click', downloadRecovery);
    document.querySelector('#retry-load')?.addEventListener('click', () => { save = loadSave(); render(); });
    document.querySelector('#retry-save')?.addEventListener('click', () => { if (save)
        storeSave(save);
    else
        save = loadSave(); render(); });
    document.querySelector('#backup-save')?.addEventListener('click', () => save && exportDiagnostic(save));
    document.querySelector('#coach-search')?.addEventListener('input', e => { document.querySelector('#coach-results').innerHTML = coachRows(e.target.value); });
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo({ top: 0, behavior: 'instant' }); });
    document.querySelector('#birth-city')?.addEventListener('input', () => { const city = document.querySelector('#birth-city').value.trim(); const local = birthCities.find(c => c.city.localeCompare(city, 'pt-BR', { sensitivity: 'base' }) === 0); if (local)
        document.querySelector('#birth-state').value = local.state; });
    document.querySelector('#career-form')?.addEventListener('submit', e => { e.preventDefault(); const city = document.querySelector('#birth-city'); const state = document.querySelector('#birth-state'); const club = document.querySelector('#heart-club'); city.value = city.value.trim(); if (!city.reportValidity() || !state.reportValidity() || !club.reportValidity())
        return; const n = document.querySelector('#name').value.trim() || 'Jogador'; const local = birthCities.find(c => c.state === state.value && c.city.localeCompare(city.value, 'pt-BR', { sensitivity: 'base' }) === 0); save = createCareer(n, club.value, local?.city ?? city.value, state.value); storeSave(save); render(); focusEvent(); });
    document.querySelector('#advance')?.addEventListener('click', () => { if (!save)
        return; save = advanceCareer(save); storeSave(save); render(); focusEvent(); });
    document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => { if (!save)
        return; save = resolveChoice(save, b.dataset.choice); storeSave(save); save = advanceCareer(save); storeSave(save); render(); focusEvent(); });
    document.querySelectorAll('[data-intent]').forEach(b => b.onclick = () => { if (!save)
        return; save = setTransferIntent(save, b.dataset.intent); storeSave(save); render(); });
    document.querySelector('#export')?.addEventListener('click', () => save && exportDiagnostic(save));
    document.querySelector('#reset')?.addEventListener('click', () => { if (confirm('Apagar esta carreira e começar de novo?')) {
        if (!clearSave()) {
            render();
            return;
        }
        save = null;
        tab = 'career';
        render();
        window.scrollTo(0, 0);
    } });
}
render();
if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('./sw.js').catch(() => { });

return {};
})();</script></body></html>
